<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="vedaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A2BC2" />
      <stop offset="100%" stop-color="#2B1382" />
    </linearGradient>
    <linearGradient id="vedaleft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#D4C8FF" />
    </linearGradient>
    <linearGradient id="vedaright" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C7B5FF" />
      <stop offset="100%" stop-color="#8C66FF" />
    </linearGradient>
    <linearGradient id="vedaNode" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#00A896" />
    </linearGradient>
    <filter id="vedaDrop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0F0638" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Rounded Squircle Badge Base -->
  <rect width="100" height="100" rx="22" fill="url(#vedaBg)" />
  <rect width="98" height="98" x="1" y="1" rx="21" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="1.5" fill="none" />

  <!-- Left Facet of V -->
  <path d="M 26 28 L 41 28 L 50 72 L 35 72 Z" fill="url(#vedaleft)" filter="url(#vedaDrop)" />

  <!-- Right Facet of V -->
  <path d="M 74 28 L 59 28 L 50 72 L 65 72 Z" fill="url(#vedaright)" filter="url(#vedaDrop)" />

  <!-- Cadastral Coordinate Diamond (Bhu-Aadhaar Node) -->
  <polygon points="50,33 58,41 50,49 42,41" fill="url(#vedaNode)" />
  <circle cx="50" cy="41" r="2.5" fill="#FFFFFF" />
</svg>
